name: Rebuild Daily Pool

# Manual only. The daily hole is computed in the browser from
# public/daily-pool.json, so nothing needs to run every day. Trigger this
# when you want fresh candidates (new good/featured articles, updated link
# counts). Takes about 10 minutes.
on:
  workflow_dispatch:

jobs:
  rebuild-pool:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build daily pool
        run: npx tsx scripts/build-daily-pool.ts public/daily-pool.json

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/daily-pool.json
          git diff --staged --quiet || git commit -m "chore: rebuild daily pool ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          git push
